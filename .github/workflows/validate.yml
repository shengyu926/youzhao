name: Validate Youzhao
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir -p tmp
      - run: python -B -X utf8 -m unittest discover -s tests -v
      - run: python -B -X utf8 scripts/build_release.py --output dist
      - run: python -B -X utf8 scripts/build_release.py --output dist --layout folder
